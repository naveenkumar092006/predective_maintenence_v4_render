services:
  - type: web
    name: pmapp
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        value: pmapp2024rendersecret
      - key: RENDER
        value: true
